x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    - PYTHONPATH=/app
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_20260805_v3:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -h 127.0.0.1 -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    <<: *backend-env
    command: sh -c "alembic upgrade head && python scripts/seed_course_rep.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # ports:
    #   - "8000:8000"

  worker:
    build:
      context: ./backend
    <<: *backend-env
    command: python worker.py

  scheduler:
    build:
      context: ./backend
    <<: *backend-env
    command: python scheduler_main.py

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    command: npm run dev -- --host 0.0.0.0
    # ports:
    #   - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data_20260805_v3:
