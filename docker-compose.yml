services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "classflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - COURSE_REP_EMAIL
      - COURSE_REP_PASSWORD
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - AI_CONFIDENCE_THRESHOLD
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
      - SMTP_USE_TLS
      - IMAP_HOST
      - IMAP_PORT
      - IMAP_USERNAME
      - IMAP_PASSWORD
      - IMAP_MAILBOX
      - IMAP_USE_SSL
      - IMAP_POLL_INTERVAL_SECONDS
      - TIMEZONE
      - FRONTEND_ORIGIN
      - ENVIRONMENT=production
    command: sh -c "alembic upgrade head && python scripts/seed_course_rep.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - AI_CONFIDENCE_THRESHOLD
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
      - SMTP_USE_TLS
      - IMAP_HOST
      - IMAP_PORT
      - IMAP_USERNAME
      - IMAP_PASSWORD
      - IMAP_MAILBOX
      - IMAP_USE_SSL
      - IMAP_POLL_INTERVAL_SECONDS
      - TIMEZONE
      - FRONTEND_ORIGIN
      - ENVIRONMENT=production
      - COURSE_REP_EMAIL
      - COURSE_REP_PASSWORD
    command: python worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - AI_CONFIDENCE_THRESHOLD
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
      - SMTP_USE_TLS
      - IMAP_HOST
      - IMAP_PORT
      - IMAP_USERNAME
      - IMAP_PASSWORD
      - IMAP_MAILBOX
      - IMAP_USE_SSL
      - IMAP_POLL_INTERVAL_SECONDS
      - TIMEZONE
      - FRONTEND_ORIGIN
      - ENVIRONMENT=production
      - COURSE_REP_EMAIL
      - COURSE_REP_PASSWORD
    command: python scheduler_main.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
