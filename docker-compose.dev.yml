# Local development overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Adds bind-mount volumes, exposed ports, and hot-reload for local dev.
# The base docker-compose.yml is production-ready (used by Coolify).

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    command: sh -c "alembic upgrade head && python scripts/seed_course_rep.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:5173

  worker:
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development

  scheduler:
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
